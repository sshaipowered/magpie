name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable # conformance/13 spawns the Rust relay
      - run: npm ci || npm install
      - run: npx tsc -b
      - run: cargo build --manifest-path rust/Cargo.toml -p magpie-relay
      - run: npx vitest run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml

  # Neither installer has a unit test, and both are served straight off Pages to
  # `curl | sh` / `irm | iex`. A syntax error in either is not a degraded
  # install, it is NO install — strictly worse than shipping nothing. The only
  # product bug that ever reached users and stayed live for weeks was in
  # install.ps1, on the one platform nothing in CI executed.
  installers:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # install.ps1 must stay pure ASCII. Pages serves it as
      # application/octet-stream with no charset and no BOM, so Windows
      # PowerShell 5.1 decodes it with the machine's ANSI codepage: a UTF-8 em
      # dash becomes bytes that terminate a string early and the script stops
      # parsing entirely. Checked on Linux because grep -P is not on the Windows
      # image, and the property is about the file, not the platform.
      - name: install.ps1 is pure ASCII
        if: runner.os != 'Windows'
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/install.ps1; then
            echo "^^ non-ASCII in install.ps1 — this breaks the script under Windows PowerShell 5.1" >&2
            exit 1
          fi
          echo "install.ps1 is pure ASCII"

      - name: shellcheck install.sh
        if: runner.os != 'Windows'
        # -s sh, not bash: the script declares #!/bin/sh and is piped to `sh`,
        # so bashisms that happen to work locally on macOS zsh must still fail.
        run: shellcheck -s sh scripts/install.sh

      # Both hosts, deliberately. `irm | iex` runs under Windows PowerShell 5.1
      # on a default Windows box; pwsh 7 has different native-argument handling.
      # A script that parses in only one of them is broken for half our users.
      - name: Parse install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\scripts\install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "install.ps1 parses under Windows PowerShell 5.1"

      - name: Parse install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "install.ps1 parses under PowerShell 7"
