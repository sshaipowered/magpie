# On every v* tag: test → build → smoke the built archives → publish.
# Artifacts per platform: magpie (CLI), magpie-relay, magpie-mcp (bun-compiled,
# no Node needed) → magpie-<os>-<arch>.tar.gz (zip on Windows).
#
# Order is the point. The release is created as a DRAFT, which the installer's
# `releases/latest` never resolves to, so nothing reaches a user until the
# smoke test has driven a real call with the exact archives. v0.4.0's first
# attempt published five broken archives before any test ran; that path no
# longer exists.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # smoke.yml declares a job needing issues:write. A called workflow may only
  # ask for permissions the caller already holds, so this must be granted here
  # even though that job never runs on the release path (it is schedule-gated).
  issues: write

jobs:
  # The unit suites, on a clean checkout. ci.yml runs the same on pushes, but
  # a tag pushed atomically with main used to reach `build` before CI had a
  # verdict. Now the tag waits for its own.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci || npm install
      - run: npx tsc -b
      - run: cargo build --manifest-path rust/Cargo.toml -p magpie-relay
      - run: npx vitest run
      - run: cargo test --manifest-path rust/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
          # macos-13 (Intel) runners are retired — cross-compile from arm64.
          - runner: macos-14
            target: darwin-x64
            rust_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
          - runner: windows-latest
            target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build Rust binaries
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.rust_target }} -p magpie-cli -p magpie-relay

      # npm materializes the @magpie/* workspace links, tsc emits the dist/
      # entrypoints those packages point at — bun then bundles from source.
      - name: Build MCP binary (bun compile)
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          bun build --compile --target=${{ matrix.bun_target }} packages/mcp/src/bin.ts --outfile magpie-mcp
        shell: bash

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.rust_target }}/release/magpie rust/target/${{ matrix.rust_target }}/release/magpie-relay dist/
          cp magpie-mcp dist/
          tar -czf magpie-${{ matrix.target }}.tar.gz -C dist magpie magpie-relay magpie-mcp

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust/target/${{ matrix.rust_target }}/release/magpie.exe, rust/target/${{ matrix.rust_target }}/release/magpie-relay.exe dist/
          Copy-Item magpie-mcp.exe dist/
          Compress-Archive -Path dist/* -DestinationPath magpie-windows-x64.zip

      # Draft: attached but invisible to `releases/latest` and to the public
      # download URL. `publish` below flips it once smoke has passed.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            magpie-*.tar.gz
            magpie-*.zip

  # Building five platforms proves only that they compile. `needs: build` means
  # every archive is attached before this runs, so it downloads what a user
  # would download and drives a real call with it. Without this the release is
  # green on compile alone, which is how a Windows-only registration bug stayed
  # live for weeks.
  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    with:
      tag: ${{ github.ref_name }}

  # Only a green smoke makes the release real. A red one leaves the draft in
  # place for inspection; users never saw it.
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
      - run: echo "published ${{ github.ref_name }}"
