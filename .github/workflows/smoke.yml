# Download the ACTUAL released archive for each platform and drive a real
# two-party call through a relay spawned from that same archive.
#
# release.yml builds five platforms and runs none of them; ci.yml runs 230 tests
# on one ubuntu box against source. Nothing in between ever executed a shipped
# binary, which is how a Windows-only registration bug stayed live for weeks.
name: smoke

on:
  # release.yml calls this with `needs: build`, passing the concrete tag.
  #
  # `release: [published]` is NOT usable: our releases are created by
  # GITHUB_TOKEN, and GitHub does not start workflow runs from token-created
  # events (softprops/action-gh-release documents the same). Making it fire
  # would mean parking a contents:write PAT in a public repo, which is a far
  # worse trade than losing one trigger.
  #
  # workflow_call also inherits the CALLER's github context, so on a tag push
  # `github.ref` is the tag and the checkout below is version-locked to the
  # release under test. `workflow_run` would instead run the default branch.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to smoke-test, or "latest".'
        type: string
        required: false
        default: latest

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1), or "latest".'
        type: string
        required: false
        default: latest

  # An unchanged release going red overnight means the runner image or the
  # published install script moved, not the binaries: the relay is spawned from
  # the archive under test, so it cannot be the cause.
  # Not a safety net on its own: GitHub drops scheduled runs under load, and
  # disables them outright after 60 days without repo activity.
  schedule:
    - cron: "17 6 * * *" # off the hour deliberately; :00 is the most-dropped slot

permissions:
  contents: read # release assets are public; this is least-privilege hygiene

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolving "latest" per-leg would let two tags landing close together hand
  # different platforms different builds, and the gate would then certify a set
  # of binaries that never existed as one release. Resolve exactly once.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - name: Resolve the release tag
        id: rel
        shell: bash
        # Via env, never `${{ inputs.tag }}` inline: GitHub substitutes into the
        # script text BEFORE bash parses it, so an inline expansion lets a
        # dispatch input close the quote and run arbitrary code on the runner.
        # The validation below cannot help, since it would run after that.
        env:
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_IN:-latest}"
          if [ "$TAG" = "latest" ]; then
            # An infrastructure lookup, so retries are legitimate here. They are
            # NOT legitimate around the call itself, where a retry would paper
            # over the intermittent peer-join races this test exists to catch.
            # Public assets need no auth: an Authorization header actually
            # breaks the cross-host redirect.
            TAG="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 60 \
              -o /dev/null -w '%{url_effective}' \
              https://github.com/sshaipowered/magpie/releases/latest | sed 's#.*/tag/##')"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "refusing to smoke-test an implausible tag: '$TAG'" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=magpie ${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "smoke-testing $TAG"

  smoke:
    needs: resolve
    strategy:
      # Never mask a leg. Hiding four platforms because Windows broke is the
      # precise failure mode this workflow exists to prevent.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            asset: magpie-darwin-arm64.tar.gz
            exe: ''
          - runner: ubuntu-latest
            asset: magpie-linux-x64.tar.gz
            exe: ''
          - runner: ubuntu-24.04-arm
            asset: magpie-linux-arm64.tar.gz
            exe: ''
          - runner: windows-latest
            asset: magpie-windows-x64.zip
            exe: '.exe'
    #
    # darwin-x64 is deliberately absent. release.yml cross-compiles it on
    # macos-14 and the Intel runners are retired, so it could only run under
    # Rosetta 2 — where bun's x64 build warns "CPU lacks AVX" because Rosetta
    # has no AVX. Real Intel Macs have AVX, so that is a test artifact rather
    # than a product bug, and a leg for it would be flaky by construction.
    # darwin-x64 therefore ships BUILD-VERIFIED ONLY. A green run here is not
    # coverage of it.
    runs-on: ${{ matrix.runner }}
    # The driver's own watchdog fires at 10 min and bounds every await. This is
    # the outer stop so a wedged relay cannot burn the 360 min default: sb_ask
    # parks for up to 10 min server-side when no peer has joined, which is
    # exactly the behaviour under test.
    timeout-minutes: 20
    steps:
      # ALWAYS the default ref. This used to pin the scheduled run to the
      # release tag, reasoning that a driver ahead of the last release would
      # fail on its own drift. That conflated two different things: the
      # BINARIES are the release artifact and are downloaded by tag below, but
      # scripts/smoke.mjs is test infrastructure that lives with the repo. It
      # was committed the day AFTER v0.2.1 was cut, so pinning to the tag
      # checked out a tree with no driver in it, and every one of the first 20
      # scheduled runs died on MODULE_NOT_FOUND without ever reaching the relay.
      - uses: actions/checkout@v4

      # `gh release download`, not the public URL: on the release path the
      # release is still a DRAFT, which the public URL cannot serve. The bytes
      # are the same archive users get once it is published.
      - name: Download and extract the release archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --output asset.tar.gz
          test "$(wc -c < asset.tar.gz)" -gt 1000000
          tar -xzf asset.tar.gz -C bin
          # Members already carry 0755, but this becomes mandatory the moment
          # anyone swaps in actions/upload-artifact, which strips the exec bit.
          chmod +x bin/magpie bin/magpie-relay bin/magpie-mcp
          # curl never sets com.apple.quarantine (only LSFileQuarantineEnabled
          # apps do), so today this is a no-op. It stays so that changing the
          # downloader cannot silently turn every macOS leg into a bare SIGKILL.
          if [ "$RUNNER_OS" = "macOS" ]; then xattr -dr com.apple.quarantine bin || true; fi
          ls -l bin

      - name: Download and extract the release archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force bin | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET --output asset.zip
          if ($LASTEXITCODE -ne 0) { throw "download failed with exit $LASTEXITCODE" }
          if ((Get-Item asset.zip).Length -lt 1000000) { throw "asset.zip is implausibly small" }
          # System32's tar.exe is bsdtar and auto-detects zip. `-z` would be
          # wrong for a zip, `unzip` is not reliably on PATH on these images, and
          # Expand-Archive is the slow path for a 42 MB archive.
          tar.exe -xf asset.zip -C bin
          if ($LASTEXITCODE -ne 0) { throw "extract failed with exit $LASTEXITCODE" }
          Get-ChildItem bin | Format-Table Name, Length

      # Before setup-node on purpose: the released binaries are standalone
      # (magpie is Rust, magpie-mcp is bun-compiled), and nothing about running
      # them may depend on a toolchain an end user would not have.
      - name: Assert the released CLI reports the expected version
        shell: bash
        env:
          EXPECTED: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(./bin/magpie${{ matrix.exe }} --version | tr -d '\r')"
          # String equality, not a regex. A loose match is exactly how a stale or
          # mis-tagged artifact sails through a "version check".
          if [ "$actual" != "$EXPECTED" ]; then
            echo "version mismatch: got '$actual', expected '$EXPECTED'" >&2
            exit 1
          fi
          echo "$actual"

      # Only the driver (.mjs) needs Node. Pinned so a runner-image Node bump
      # cannot change the result.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # The relay comes from the SAME archive as the MCP under test, started here
      # and torn down here. There is no hosted relay: the last one died on Fly
      # and reddened 21 nightlies in a row for a reason unrelated to any release.
      # Running it in this step rather than an earlier one is deliberate; a
      # background process is not guaranteed to survive a step boundary on every
      # runner, and a relay that quietly died between steps would surface as an
      # unrelated join failure.
      #
      # Port 0 lets the OS pick, so concurrent legs cannot collide. `shell: bash`
      # on every platform: Git Bash on the Windows image handles `&`, `kill` and
      # the trap the same way.
      #
      # No continue-on-error, no `|| true`, no `if: always()`: the step's exit
      # code IS the platform's verdict, and Windows is the whole reason this
      # file exists.
      - name: Two-party call through a relay from the same archive
        shell: bash
        run: |
          set -euo pipefail
          ./bin/magpie-relay${{ matrix.exe }} 0 > relay.log 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            grep -q "listening on" relay.log && break
            sleep 0.2
          done
          grep -q "listening on" relay.log || { echo "magpie-relay never announced a listener:" >&2; cat relay.log >&2; exit 1; }
          port="$(tr -d '\r' < relay.log | sed -n 's/.*listening on ws:\/\/[^:]*:\([0-9][0-9]*\).*/\1/p' | head -1)"
          test -n "$port" || { echo "could not parse the relay port from:" >&2; cat relay.log >&2; exit 1; }
          echo "relay: ws://127.0.0.1:$port"
          node scripts/smoke.mjs "bin/magpie-mcp${{ matrix.exe }}" "ws://127.0.0.1:$port"

  # Everything above downloads the release archive by hand. NOBODY does that —
  # the README tells people to pipe a script off Pages into their shell, and
  # that path has never been executed by anything. It is also the path with the
  # most ways to break silently: Pages serves install.ps1 as
  # application/octet-stream with no charset and no BOM, so how Windows
  # PowerShell 5.1 decodes it is a property of the HOST, invisible from here.
  # On the release path the release under test is still a DRAFT, and the
  # install one-liner resolves `releases/latest`, which never points at a
  # draft. So here the front door exercises the CURRENT install scripts against
  # the previously published binaries; the new archives are covered by the
  # `smoke` matrix above. That is the intended split: this job is about the
  # scripts, that one is about the binaries.
  frontdoor:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # `shell: powershell` is Windows PowerShell 5.1 on purpose. pwsh 7 is not
      # what a default Windows box runs, and the two decode downloaded text
      # differently — testing only pwsh would prove nothing about real users.
      # Parse the exact string `iex` would evaluate. Counting suspicious
      # characters only guesses; handing the downloaded text to the same parser
      # answers the actual question. A first attempt here also checked the body
      # with Invoke-WebRequest, which throws NullReferenceException on 5.1
      # without -UseBasicParsing — the probe failed on its own bug and told us
      # nothing about the product.
      - name: Does the served install.ps1 parse under Windows PowerShell 5.1?
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $r = Invoke-RestMethod https://sshaipowered.github.io/magpie/install.ps1
          Write-Host "irm returned: $($r.GetType().FullName)"
          if ($r -isnot [string]) {
            Write-Host "NOT A STRING - iex cannot evaluate this"
            exit 1
          }
          $nonAscii = ([regex]::Matches($r, '[^\x00-\x7F]')).Count
          Write-Host "non-ASCII chars after decode: $nonAscii"
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($r, [ref]$null, [ref]$errs)
          if ($errs) {
            Write-Host "the script served to users does not parse on a default Windows box:"
            $errs | ForEach-Object { Write-Host "  $($_.Message)" }
            exit 1
          }
          Write-Host "served install.ps1 parses clean"

      # BEFORE the installer runs, not after. Auto-registration is guarded by
      # `command -v` / `Get-Command`, so on a bare runner every registration
      # branch is skipped and the installer proves only that it parses. That is
      # the exact state the last Windows-only installer bug survived in for
      # weeks. Installing a real host first makes that code actually execute.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install a real MCP host to register against
        shell: bash
        # Gemini CLI is the third-party host magpie has a live cross-vendor call
        # verified against. No API key is needed: `mcp add` / `mcp list` are
        # local config operations and never reach a model.
        run: npm i -g @google/gemini-cli@0.55.1

      - name: Run the advertised one-liner (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://sshaipowered.github.io/magpie/install.ps1 | iex
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "installer exited $LASTEXITCODE" }
          $exe = Join-Path $HOME ".magpie\bin\magpie.exe"
          if (-not (Test-Path $exe)) { throw "installer finished but $exe is missing" }
          & $exe --version

      - name: Run the advertised one-liner (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sshaipowered.github.io/magpie/install.sh | sh
          test -x "$HOME/.magpie/bin/magpie"
          "$HOME/.magpie/bin/magpie" --version

      # Assert against the config file, not `gemini mcp list`: the list output
      # reports a correctly registered server as "Disabled" whenever the folder
      # is untrusted, so it cannot distinguish "not registered" from "gated".
      # The user-scope settings file is what the installer is responsible for.
      - name: The installer actually registered the MCP server
        shell: bash
        run: |
          set -euo pipefail
          cfg="$HOME/.gemini/settings.json"
          test -f "$cfg" || { echo "installer never wrote $cfg" >&2; exit 1; }
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const s = cfg.mcpServers && cfg.mcpServers.magpie;
            if (!s) { console.error("magpie missing from mcpServers"); process.exit(1); }
            // A registration pointing at a path that does not exist would still
            // look correct in the file and fail for every user on first call.
            if (!fs.existsSync(s.command)) {
              console.error("registered command does not exist: " + s.command);
              process.exit(1);
            }
            // MAGPIE_EXTENSION must stay unset so magpie-mcp derives and
            // sanitizes the address itself (v0.2.1). Writing it here is what
            // broke every user whose account name had a capital or a space.
            if (s.env && s.env.MAGPIE_EXTENSION) {
              console.error("installer wrote MAGPIE_EXTENSION; derivation is bypassed");
              process.exit(1);
            }
            console.log("registered -> " + s.command);
          ' "$cfg"

  # With fail-fast:false a single red leg can still read as an ambiguous overall
  # result. This collapses the matrix into one unambiguous verdict for the
  # release run that calls this workflow. It is not a PR gate: there is no
  # pull_request trigger, so requiring it as a status check would hang every PR
  # forever.
  gate:
    needs: [smoke, frontdoor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # frontdoor is gated too, deliberately. Binaries that work but cannot be
      # installed are not a shippable release, and leaving a check unwired is
      # how the smoke workflow itself sat as dead code until someone looked.
      - name: Require every platform to pass
        run: |
          echo "smoke matrix: ${{ needs.smoke.result }}"
          echo "front door:   ${{ needs.frontdoor.result }}"
          [ "${{ needs.smoke.result }}" = "success" ] && [ "${{ needs.frontdoor.result }}" = "success" ]

  # The first 20 scheduled runs all failed, and nobody noticed for 20 days,
  # because a red cron produces no notification anyone reads. A watchdog whose
  # alarm goes nowhere is not a watchdog. This turns the result into an issue —
  # exactly one, opened when it breaks and closed when it recovers, so a long
  # outage does not become 30 identical comments.
  #
  # Schedule only. On the release path the red gate is already blocking and
  # someone is by definition watching.
  watchdog:
    needs: [smoke, frontdoor]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report or clear the nightly result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE: ${{ needs.smoke.result }}
          FRONTDOOR: ${{ needs.frontdoor.result }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$REPO" --state open --label watchdog \
                   --json number --jq '.[0].number // empty')

          if [ "$SMOKE" = "success" ] && [ "$FRONTDOOR" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$REPO" \
                --comment "Recovered: nightly smoke is green again. $RUN_URL"
              echo "closed #$open"
            else
              echo "green, nothing open"
            fi
            exit 0
          fi

          if [ -n "$open" ]; then
            echo "already reported in #$open — not commenting again"
            exit 0
          fi

          gh issue create --repo "$REPO" --label watchdog \
            --title "Nightly smoke is failing" \
            --body "$(printf 'The scheduled smoke run went red against the current release.\n\n- released-binary matrix: **%s**\n- install one-liner (front door): **%s**\n\n%s\n\nThe binaries under test did not change and the relay is spawned locally, so a failure here means the runner image or the published install script moved. This issue closes itself when a later nightly comes back green.' "$SMOKE" "$FRONTDOOR" "$RUN_URL")"
